<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca</title>
</head>
<body>
    <h1>Biblioteca</h1>

    <button id="botao-listar">Listar livros</button>
    <ul id="lista"></ul>

    <h2>Buscar pelo codigo</h2>
    <input id="codigo" type="number">
    <button id="botao-buscar">Buscar</button>
    <p id="resultado"></p>

    <h2>Cadastrar Livro</h2>
    <input id="titulo" placeholder="Titulo">
    <input id="autor" placeholder="Autor">
    <input id="ano" type="number" placeholder="Ano">
    <button id="botao-cadastrar">Cadastrar</button>
    <p id="mensagem"></p>

    <script src="app.js"></script>
</body>
</html>
